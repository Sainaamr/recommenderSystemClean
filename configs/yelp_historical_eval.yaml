# Evaluation config for Yelp historical training only.
# Real test set is yelp-realtime — no test split needed here.
#
# mode: full — despite the name, this is the FASTER option in practice here,
# not uni100. uni100 requires per-user negative sampling for ~60k users,
# and RecBole's sampler implements that with a plain Python loop
# (recbole/sampler/sampler.py, sample_by_key_ids), not a vectorized
# operation — millions of scalar Python-level checks, which is dramatically
# slower in wall-clock time than one vectorized full-catalog matrix multiply,
# confirmed empirically: uni100 measured at ~5.6 hours/epoch eval vs full's
# ~30 seconds/epoch eval, same data/hardware. Do not switch this back to
# uni100 without re-verifying the sampler performance first.
eval_args:
  split: {RS: [0.8, 0.1, 0.1]}   # internal split for early stopping only
  group_by: user
  order: TO
  mode: full

metrics: [Recall, NDCG]
topk: [10]
valid_metric: Recall@10
